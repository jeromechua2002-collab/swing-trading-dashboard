name: Post-close freshness monitor

# Fails, so GitHub emails the owner, when the public dashboards or either Notion
# workspace lag the latest NYSE session that closed at least 6 hours earlier.
# Read-only. Logs carry session dates only.
on:
  schedule:
    - cron: "45 7 * * 2-6"
    - cron: "45 11 * * 2-6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshness-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NUS_TRADING_SYNC: ${{ secrets.NUS_TRADING_SYNC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Offline tests
        run: python -m unittest discover -s scripts -p 'test_freshness_monitor.py' -v
      - name: Check freshness
        run: python scripts/freshness_monitor.py
