name: NUS journal catch-up (one-off, owner-approved)

# Temporary: copies trades #13-#14 from the production journal to the NUS copy,
# then re-runs the read-only preflight. Removed from the branch after it runs.
on:
  push:
    branches: ["chore/nus-notion-preflight-20261015"]
    paths: [".github/workflows/nus-journal-catchup.yml"]

permissions:
  contents: read

concurrency:
  group: nus-journal-catchup
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NUS_TRADING_SYNC: ${{ secrets.NUS_TRADING_SYNC }}
      NUS_CATCHUP_TRADES: "13,14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check requests==2.34.2
      - name: Offline tests
        run: python -m unittest discover -s scripts -p 'test_nus_*.py' -v
      - name: Plan
        run: python scripts/nus_journal_catchup.py
      - name: Apply
        run: python scripts/nus_journal_catchup.py --apply
      - name: Verify with the read-only preflight
        run: python scripts/nus_notion_preflight.py
