<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swing Account Equity</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0f1115;color:#eef2f7;font:14px system-ui,sans-serif}.wrap{padding:18px}.head{display:flex;gap:14px;justify-content:space-between;align-items:end;flex-wrap:wrap}h1{font-size:20px;margin:0 0 5px}.sub,.note{color:#99a4b5;font-size:12px}.kpis{display:flex;flex-wrap:wrap;gap:10px}.kpi{border:1px solid #292f3a;background:#151922;padding:10px 13px;border-radius:10px;min-width:135px}.lab{font-size:10px;color:#95a1b3;text-transform:uppercase;letter-spacing:.05em}.val{font-size:18px;font-weight:700;margin-top:3px}.panel{margin-top:15px;background:#151922;border:1px solid #292f3a;border-radius:13px;padding:12px}svg{width:100%;height:auto}.axis{fill:#8f9baa;font-size:12px}.line{fill:none;stroke:#29ae75;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.grid{stroke:#303742;stroke-width:1}.area{fill:#29ae75;fill-opacity:.1}.node{stroke:#151922;stroke-width:3}.note{margin:12px 0}.err{color:#f18b8b}
</style></head><body><main class="wrap"><div class="head"><div><h1>Account Equity / Capital Curve</h1><div id="meta" class="sub">Loading closed trades from journal sync…</div></div><div class="kpis"><div class="kpi"><div class="lab">Account equity</div><div class="val" id="equity">—</div></div><div class="kpi"><div class="lab">Realized P/L</div><div class="val" id="pnl">—</div></div><div class="kpi"><div class="lab">Account return</div><div class="val" id="ret">—</div></div></div></div><section class="panel"><svg id="curve" viewBox="0 0 1100 420" role="img" aria-label="Notion-linked swing-account equity curve"></svg></section><div class="note" id="note">Open positions are shown separately and excluded from realized equity. FX uses the rate recorded in each trade.</div></main><script>
(async()=>{const $=id=>document.getElementById(id),sg=n=>'S$'+Number(n).toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2});try{const r=await fetch('data/journal-performance.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Journal snapshot unavailable ('+r.status+')');const d=await r.json();const p=d.curve||[];if(p.length<2)throw Error('Missing equity history');$('equity').textContent=sg(d.current_equity_sgd);$('pnl').textContent=(d.realized_pnl_sgd>=0?'+':'')+sg(d.realized_pnl_sgd);$('ret').textContent=(d.return_pct>=0?'+':'')+Number(d.return_pct).toFixed(2)+'%';$('meta').textContent=d.closed_trades.length+' closed trades · '+d.open_trades.length+' open positions · synced '+new Date(d.updated_at).toLocaleString();const svg=$('curve'),ns='http://www.w3.org/2000/svg',add=(tag,attrs,text)=>{const el=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))el.setAttribute(k,v);if(text!==undefined)el.textContent=text;svg.appendChild(el);return el;};let vals=p.map(x=>Number(x.equity_sgd)),min=Math.min(...vals),max=Math.max(...vals),pad=Math.max(20,(max-min)*.13);min-=pad;max+=pad;let W=1100,H=420,L=85,R=25,T=30,B=58,x=i=>L+(W-L-R)*i/Math.max(1,p.length-1),y=v=>T+(H-T-B)*(max-v)/(max-min);for(let k=0;k<=4;k++){const val=min+(max-min)*k/4,yy=y(val);add('line',{x1:L,y1:yy,x2:W-R,y2:yy,class:'grid'});add('text',{x:8,y:yy+4,class:'axis'},sg(val));}let points=p.map((d,i)=>x(i)+','+y(d.equity_sgd)).join(' ');add('polygon',{points:points+' '+x(p.length-1)+','+(H-B)+' '+x(0)+','+(H-B),class:'area'});add('polyline',{points,class:'line'});p.forEach((d,i)=>{const c=add('circle',{cx:x(i),cy:y(d.equity_sgd),r:6,fill:i===0?'#97a5ba':Number(d.net_sgd)<0?'#eb6262':'#29ae75',class:'node'});const tip=document.createElementNS(ns,'title');tip.textContent='#'+d.number+' '+d.symbol+' · '+sg(d.equity_sgd)+' · '+d.date;c.appendChild(tip);if(i===0||i===p.length-1||p.length<=10)add('text',{x:x(i),y:H-30,'text-anchor':'middle',class:'axis'},i===0?'Start':'#'+d.number);});$('note').textContent+=' Last published snapshot: '+d.updated_at+'.';}catch(e){$('meta').textContent='Journal sync unavailable';$('meta').className='sub err';$('note').textContent=e.message+' — values deliberately withheld instead of displaying stale figures.';}})();
</script></body></html>
