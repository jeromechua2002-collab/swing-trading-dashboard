name: Sync Notion rotation model

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/notion-rotation.yml"
      - "scripts/sync_notion_rotation.py"
  workflow_dispatch:
  schedule:
    # 22:15 UTC is after the U.S. cash close in both EDT and EST.
    - cron: "15 22 * * 1-5"
    # Catch-up at 11:30 SGT Tue-Sat if the prior US close missed the main run.
    # The sync checks Notion against the latest SPY date and skips a fresh snapshot.
    - cron: "30 3 * * 2-6"
    # Extra post-close slots: GitHub has started scheduled runs 2-5 h late, and Yahoo's
    # daily bar can appear after the 22:15 run. Each run skips when Notion is current.
    - cron: "30 1 * * 2-6"
    - cron: "0 6 * * 2-6"

permissions:
  contents: read

concurrency:
  group: "notion-rotation-sync"
  # Never cancel mid-write: a queued run waits, then finds everything current.
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NUS_TRADING_SYNC: ${{ secrets.NUS_TRADING_SYNC }}
      NOTION_ROTATION_CHART_DS: "485d139e-0f47-45b2-bce8-bbd40f29bf33"
      NOTION_ROTATION_SIGNAL_DS: "57786668-c8d4-4604-b009-a1706766cec3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Check Notion token
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::error::NOTION_TOKEN GitHub Actions secret is missing."
            echo "Create a Notion internal integration, share the two Rotation databases with it,"
            echo "then add its token as the repository secret NOTION_TOKEN."
            exit 1
          fi

      - name: Refresh chart and state map
        run: python scripts/sync_notion_rotation.py

      # Production stays the personal workspace. NUS receives an exact copy of the two
      # rotation databases only: keyed creates and updates, never deletes, never journal.
      # Runs only after a successful sync, so both workspaces carry the same session.
      - name: Mirror rotation databases to NUS
        if: env.NUS_TRADING_SYNC != ''
        run: python scripts/nus_rotation_catchup.py --apply

      - name: Verify strict NUS rotation parity
        if: env.NUS_TRADING_SYNC != ''
        run: python scripts/nus_rotation_catchup.py
