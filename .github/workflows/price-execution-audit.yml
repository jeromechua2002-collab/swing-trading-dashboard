name: Price and execution pre-release audit
on:
  push:
    branches: ["feat/price-execution-gates-20261013"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install market-data dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Test absolute price and session aggregation
        run: python -m unittest discover -s scripts -p 'test_price_context.py' -v
      - name: Test execution gate risk vetoes
        run: |
          node --check trade-gate.js
          node scripts/test_execution_gate.cjs
      - name: Build RRG prices and daily/4H close context
        run: python scripts/build_rrg_data.py
      - name: Validate unchanged October 9 EdgeRater reference
        run: python scripts/validate_rrg.py
      - name: Build all 11 breadth pairs
        run: python scripts/build_sector_breadth.py
      - name: Full 116 stock and 4 timeframe audit
        run: python scripts/audit_market_universe.py
      - name: Validate both live browser modules and ticker mapping
        run: |
          node scripts/test_stock_leadership.cjs
          node scripts/test_execution_gate.cjs
          node scripts/test_breadth_confirmation.cjs
          node scripts/test_breadth_ticker_mapping.cjs
          node scripts/test_breadth_feed.cjs data/sector-breadth.json
      - name: Preserve audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-price-audit
          path: |
            data/rrg-core.json
            data/rrg-validation.json
            data/stocks/XLV.json
            data/stocks/XLK.json
            data/sector-breadth.json
          if-no-files-found: warn
