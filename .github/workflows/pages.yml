name: Build and deploy trading dashboard

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Two post-close attempts rather than hourly builds during incomplete market data.
    # 00:30 UTC Tue-Sat = 08:30 SGT, well after the US market closes.
    - cron: "30 0 * * 2-6"
    # Vendor data catch-up at 12:00 SGT Tue-Sat.
    # Incomplete data still fails closed; manual dispatch remains available.
    - cron: "0 4 * * 2-6"
    # Extra slots absorb GitHub scheduler delays (runs observed 2-5 h late; the
    # 16 Oct 00:30 UTC run never started). Each build still fails closed.
    - cron: "30 2 * * 2-6"
    - cron: "30 6 * * 2-6"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Pages uses custom GitHub Actions (not branch deployment)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, sys
          from urllib import request, error
          req = request.Request(
              "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/pages",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
              })
          try:
              with request.urlopen(req, timeout=20) as resp:
                  site = json.load(resp)
          except error.HTTPError as exc:
              print(f"::error title=Pages configuration unreadable::GitHub Pages API HTTP {exc.code}. Check repository Pages access and source.", flush=True)
              sys.exit(1)
          mode = site.get("build_type")
          print("GitHub Pages publisher:", mode, "URL:", site.get("html_url"))
          if mode != "workflow":
              print("::error title=Conflicting Pages publishers::Pages is configured to publish from a branch, while this workflow deploys generated JSON artifacts. Switch Settings > Pages > Build and deployment > Source to GitHub Actions. The branch publisher can overwrite generated data and cause 404 errors.")
              sys.exit(1)
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install market-data dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Audit every HTML dashboard and inline JavaScript
        run: node scripts/test_all_dashboards.cjs

      - name: Test dated reference crossovers without forward-looking data
        run: python -m unittest discover -s scripts -p 'test_reference_trajectory.py' -v

      - name: Test completed-bar policy (NYSE calendar, holidays, early closes, DST)
        run: python -m unittest discover -s scripts -p 'test_completed_bars.py' -v

      - name: Test lagging market-data retries without synthetic backfill
        run: python -m unittest discover -s scripts -p 'test_vendor_daily_retry.py' -v

      - name: Unit-test release provenance and data coherence
        run: python -m unittest discover -s scripts -p 'test_release_manifest.py' -v

      - name: Test journal privacy contract and publication allowlist
        run: python -m unittest discover -s scripts -p 'test_publication_privacy.py' -v

      - name: Test research cockpit and data health UI
        run: |
          node --check desk-health.js
          node scripts/test_desk_health.cjs
          node scripts/test_desk_home.cjs

      - name: Unit-test absolute price data hygiene
        run: python -m unittest discover -s scripts -p 'test_price_context.py' -v

      - name: Test execution risk gates and broker-session protection
        run: |
          node --check trade-gate.js
          node scripts/test_execution_gate.cjs

      - name: Build RRG data
        run: python scripts/build_rrg_data.py

      - name: Validate RRG against EdgeRater benchmark
        run: python scripts/validate_rrg.py

      - name: Compare October 13 reference with model using matching bar dates
        run: python scripts/audit_rrg_reference_daily.py

      - name: Assess RRG parameter sensitivity
        run: python scripts/rrg_sensitivity.py

      - name: Test sector comparison rules for every pair
        run: python -m unittest discover -s scripts -p "test_sector_breadth.py"

      - name: Test breadth feed and confirmation UI
        run: |
          node scripts/test_breadth_confirmation.cjs
          node scripts/test_breadth_ticker_mapping.cjs
          node --check breadth-feed.js
          node --check breadth-confirmation.js

      - name: Build equal-weight sector comparison
        run: python scripts/build_sector_breadth.py

      - name: Validate every ticker and timeframe
        run: python scripts/audit_market_universe.py

      - name: Test all stock leadership, price context and both frontends
        run: |
          node --check stock-leadership.js
          node --check trade-gate.js
          node scripts/test_stock_leadership.cjs
          node scripts/test_execution_gate.cjs

      - name: Sync public journal index (closed trades, percentages only)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          JOURNAL_START_CAPITAL_SGD: ${{ secrets.JOURNAL_START_CAPITAL_SGD }}
        run: python scripts/sync_journal_performance.py

      - name: Audit public journal snapshot against the privacy contract
        run: python scripts/test_journal_snapshot.py

      - name: Build fail-closed release manifest for all public dashboards
        run: python scripts/build_release_manifest.py

      - name: Assemble and audit allowlisted publication directory
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/build_site.py _site

      - name: Browser-test stock radar, RRG, breadth and embedded Notion-like view
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          pip install playwright==1.56.0
          python -m playwright install chromium
          python -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/trading-desk-http.log 2>&1 &
          DASHBOARD_TEST_URL=http://127.0.0.1:8765/ python scripts/smoke_dashboard_browser.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed dashboard data
        run: python scripts/check_live_dashboard.py "${{ steps.deployment.outputs.page_url }}"

      - name: Verify public endpoints no longer expose private journal data or source files
        run: python scripts/check_public_exposure.py "${{ steps.deployment.outputs.page_url }}"
