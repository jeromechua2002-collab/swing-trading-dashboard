<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trade P/L Calendar</title><style>
:root{color-scheme:dark;--bg:#0f1115;--panel:#151922;--border:#252b36;--muted:#8f9baa;--green:#2fb171;--red:#eb6262}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef2f7;font:14px system-ui,sans-serif}.wrap{padding:18px}h1{font-size:20px;margin:0 0 5px}.sub,.footer{color:var(--muted);font-size:12px}.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:15px}.dow{text-align:center;padding:10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)}.day{padding:8px;min-height:100px;background:var(--panel);border-right:1px solid var(--border);border-bottom:1px solid var(--border)}.blank{background:#111419}.num{color:var(--muted);font-size:11px}.win{background:#173124}.loss{background:#352020}.total{font-weight:750;margin:8px 0 5px}.win .total{color:#54d28d}.loss .total{color:#ff8585}.trade{display:flex;gap:4px;justify-content:space-between;font-size:10px;margin-top:4px;padding:5px;border-radius:5px;background:#222a35}.footer{margin-top:11px}@media(max-width:650px){.wrap{padding:8px}.day{min-height:86px;padding:4px}.trade{font-size:9px;display:block}.total{font-size:11px}.dow{padding:5px}}
</style></head><body><div class="wrap"><h1 id="title">Trade P/L Calendar</h1><div class="sub" id="status">Loading verified closed trades from Notion sync…</div><div class="cal" id="calendar"></div><div class="footer" id="footer">Only realized P/L appears on the calendar. Open positions are excluded.</div></div><script>
(async()=>{const fmt=n=>(n>=0?'+':'−')+'S$'+Math.abs(n).toFixed(2),el=document.getElementById('calendar');try{const r=await fetch('data/journal-performance.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Unable to read journal snapshot');const d=await r.json();const today=new Date();const last=d.closed_trades[d.closed_trades.length-1];const ref=last?new Date(last.exit_date+'T12:00:00Z'):today;const year=ref.getUTCFullYear(),month=ref.getUTCMonth();document.getElementById('title').textContent=ref.toLocaleString('en-US',{month:'long',year:'numeric',timeZone:'UTC'})+' — Trade P/L Calendar';const add=(tag,cls,txt,parent=el)=>{let x=document.createElement(tag);x.className=cls;if(txt!==undefined)x.textContent=txt;parent.appendChild(x);return x;};['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(t=>add('div','dow',t));const first=(new Date(Date.UTC(year,month,1)).getUTCDay()+6)%7,count=new Date(Date.UTC(year,month+1,0)).getUTCDate();for(let i=0;i<first;i++)add('div','day blank');for(let day=1;day<=count;day++){const key=year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0'),row=d.calendar[key],cell=add('div','day '+(row?(row.net_sgd>=0?'win':'loss'):''));add('div','num',day,cell);if(row){add('div','total',fmt(row.net_sgd),cell);for(const trade of row.trades)add('div','trade',trade.symbol+' #'+trade.number+' '+fmt(trade.net_sgd),cell)}}while(el.children.length%7) add('div','day blank');document.getElementById('status').textContent=d.closed_trades.length+' closed trades · '+d.open_trades.length+' open · last synced '+new Date(d.updated_at).toLocaleString();}catch(e){document.getElementById('status').textContent='Sync unavailable: '+e.message;document.getElementById('footer').textContent='Stale calendar deliberately hidden; check GitHub Actions journal sync.'}})();
</script></body></html>
