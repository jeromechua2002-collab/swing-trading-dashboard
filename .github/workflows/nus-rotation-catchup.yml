name: NUS rotation catch-up (one-off, owner-approved)

# Copies the two rotation databases from production to NUS by key (create and update
# only, never delete, never journal), then runs the strict parity check.
# Temporary: removed from the branch after it runs. Logs carry counts and dates only.
on:
  push:
    branches: ["fix/post-close-freshness-nus-mirror-20261016"]
    paths: [".github/workflows/nus-rotation-catchup.yml"]

permissions:
  contents: read

concurrency:
  group: nus-rotation-catchup
  cancel-in-progress: false

jobs:
  rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NUS_TRADING_SYNC: ${{ secrets.NUS_TRADING_SYNC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check requests==2.34.2
      - name: Offline tests
        run: python -m unittest discover -s scripts -p 'test_nus_*.py' -v
      - name: Dry run
        run: python scripts/nus_rotation_catchup.py || true
      - name: Apply (create and update only)
        run: python scripts/nus_rotation_catchup.py --apply
      - name: Strict parity (must pass)
        run: python scripts/nus_rotation_catchup.py
      - name: Full preflight with fail-closed rotation checks
        run: python scripts/nus_notion_preflight.py
